<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 12px 16px; text-align: center; }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .stats-row { display: flex; gap: 12px; padding: 8px 16px; font-size: 11px; justify-content: center; }
    .stat { text-align: center; }
    .stat .num { font-size: 18px; font-weight: 700; color: #667eea; }
    .stat .label { color: #888; font-size: 10px; }
    .stat.warn .num { color: #e74c3c; }
    .search-box { padding: 8px 12px; }
    .search-box input { width: 100%; padding: 8px 12px; border: 1px solid #2d2d44; border-radius: 8px; background: #12121f; color: #e0e0e0; font-size: 12px; outline: none; }
    .search-box input:focus { border-color: #667eea; }
    .search-results { max-height: 160px; overflow-y: auto; display: none; margin: 0 12px; }
    .search-results.visible { display: block; }
    .search-item { padding: 6px 8px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .search-item:hover { background: #2d2d44; }
    .search-item .favicon { width: 14px; height: 14px; flex-shrink: 0; }
    .search-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-item .active-dot { width: 6px; height: 6px; border-radius: 50%; background: #27ae60; flex-shrink: 0; }
    .actions { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    button { padding: 9px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all .2s; display: flex; align-items: center; gap: 8px; color: #fff; text-align: left; }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    button:active { transform: scale(.98); }
    .btn-primary { background: #667eea; }
    .btn-secondary { background: #2d2d44; }
    .btn-danger { background: #e74c3c; }
    .btn-success { background: #27ae60; }
    .btn-warn { background: #f39c12; }
    .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .divider { border-top: 1px solid #2d2d44; margin: 4px 0; }
    .footer { padding: 10px 16px; font-size: 10px; color: #555; text-align: center; border-top: 1px solid #2d2d44; }
    a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Smart Tab Manager</h1>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat"><div class="num" id="tabCount">-</div><div class="label">Tabs</div></div>
    <div class="stat"><div class="num" id="groupCount">-</div><div class="label">Groups</div></div>
    <div class="stat warn"><div class="num" id="dupCount">-</div><div class="label">Dupes</div></div>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search tabs...">
  </div>
  <div class="search-results" id="searchResults"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-primary" id="smartGroup">
      <span class="icon">🤖</span> Smart Group by Topic
    </button>
    <button class="btn-primary" id="autoGroup" style="background:#2d2d44">
      <span class="icon">📦</span> Group by Domain
    </button>
    <button class="btn-warn" id="closeDuplicates" style="display:none">
      <span class="icon">🗑️</span> Close Duplicates
    </button>
    <div class="divider"></div>
    <button class="btn-secondary" id="collapseAll">
      <span class="icon">📁</span> Collapse All Groups
    </button>
    <button class="btn-secondary" id="saveSession">
      <span class="icon">💾</span> Save Session
    </button>
    <button class="btn-success" id="restoreSession">
      <span class="icon">📂</span> Restore Last Session
    </button>
    <button class="btn-danger" id="ungroupAll">
      <span class="icon">🔓</span> Ungroup All
    </button>
  </div>

  <div class="footer">
    <a href="https://github.com/boop-TAO/smart-tab-manager" target="_blank">⭐ Star on GitHub</a> · v1.1
  </div>
  <script src="popup.js"></script>
</body>
</html>
