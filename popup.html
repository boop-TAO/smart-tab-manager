<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 14px 16px; text-align: center; }
    .header h1 { font-size: 16px; font-weight: 600; color: #fff; }
    .header p { font-size: 11px; opacity: .8; margin-top: 2px; }
    .actions { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all .2s; display: flex; align-items: center; gap: 8px; color: #fff; }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    button:active { transform: scale(.98); }
    .btn-primary { background: #667eea; }
    .btn-secondary { background: #2d2d44; }
    .btn-danger { background: #e74c3c; }
    .btn-success { background: #27ae60; }
    .icon { font-size: 16px; width: 20px; text-align: center; }
    .stats { padding: 8px 16px; font-size: 11px; color: #888; text-align: center; border-top: 1px solid #2d2d44; }
    .footer { padding: 10px 16px; font-size: 10px; color: #555; text-align: center; border-top: 1px solid #2d2d44; }
    a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Smart Tab Manager</h1>
    <p>AI-powered tab organization</p>
  </div>
  <div class="actions">
    <button class="btn-primary" id="autoGroup">
      <span class="icon">📦</span> Auto-Group Tabs by Domain
    </button>
    <button class="btn-secondary" id="collapseAll">
      <span class="icon">📁</span> Collapse All Groups
    </button>
    <button class="btn-secondary" id="saveSession">
      <span class="icon">💾</span> Save Current Session
    </button>
    <button class="btn-success" id="restoreSession">
      <span class="icon">📂</span> Restore Last Session
    </button>
    <button class="btn-danger" id="ungroupAll">
      <span class="icon">🔓</span> Ungroup All Tabs
    </button>
  </div>
  <div class="stats" id="stats">Loading...</div>
  <div class="footer">
    <a href="https://github.com/boop-TAO/smart-tab-manager" target="_blank">⭐ Star on GitHub</a> · v1.0
  </div>
  <script src="popup.js"></script>
</body>
</html>
